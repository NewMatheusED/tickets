version: "3.8"
services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - tickets_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  backend:
    image: newmatheused/ticketsadmin_backend:latest
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      DB_USERNAME: "${MYSQL_USER}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: "${MYSQL_DATABASE}"
    ports:
      - "5000:5000"
    networks:
      - tickets_network
    depends_on:
      - db
    entrypoint: /wait-for-db.sh  # Aguardar o banco estar pronto antes de iniciar o backend
    volumes:
      - ./wait-for-db.sh:/wait-for-db.sh  # Montando o script no container
    working_dir: / # Garantir que o script tenha permissão de execução no diretório correto

  frontend:
    image: newmatheused/ticketsadmin_frontend:latest
    ports:
      - "3000:3000"
    networks:
      - tickets_network

volumes:
  db_data:

networks:
  tickets_network:
    driver: overlay
    attachable: true  # Permite que containers individuais se conectem a essa rede
